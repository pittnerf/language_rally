<svg width="320" height="280" viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAF9"/>
      <stop offset="100%" style="stop-color:#F0E0EB"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#EEF7F5"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9B8E"/>
      <stop offset="100%" style="stop-color:#C5A0B5"/>
    </linearGradient>
    <linearGradient id="chipGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9B8E"/>
      <stop offset="100%" style="stop-color:#5DB8A8"/>
    </linearGradient>
    <linearGradient id="chipGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E27D60"/>
      <stop offset="100%" style="stop-color:#F09070"/>
    </linearGradient>
    <linearGradient id="chipGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C5A0B5"/>
      <stop offset="100%" style="stop-color:#D8B6CA"/>
    </linearGradient>
    <filter id="sh2" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#4A9B8E" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="280" fill="url(#bg2)" rx="20"/>

  <!-- Soft accent circles -->
  <circle cx="38" cy="42" r="40" fill="#B8E6DD" opacity="0.3"/>
  <circle cx="285" cy="248" r="38" fill="#FFDAD5" opacity="0.38"/>
  <circle cx="160" cy="260" r="22" fill="#F0E0EB" opacity="0.5"/>

  <!-- ── Text document (left) ───────────────────────── -->
  <rect x="18" y="62" width="92" height="160" rx="8" fill="url(#docGrad)" stroke="#B8E6DD" stroke-width="1.5" filter="url(#sh2)"/>
  <!-- Dog-ear fold -->
  <path d="M92,62 L110,80 L92,80 Z" fill="#D8F0EB" stroke="#B8E6DD" stroke-width="1"/>
  <!-- "TEXT" label -->
  <rect x="30" y="72" width="46" height="12" rx="3" fill="#4A9B8E" opacity="0.2"/>
  <text x="53" y="82" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#4A9B8E" text-anchor="middle">TEXT</text>
  <!-- Text lines in document -->
  <rect x="28" y="92"  width="72" height="4" rx="2" fill="#1A3530" opacity="0.18"/>
  <rect x="28" y="101" width="60" height="4" rx="2" fill="#1A3530" opacity="0.12"/>
  <rect x="28" y="110" width="72" height="4" rx="2" fill="#1A3530" opacity="0.18"/>
  <rect x="28" y="119" width="50" height="4" rx="2" fill="#1A3530" opacity="0.12"/>
  <rect x="28" y="128" width="68" height="4" rx="2" fill="#E27D60" opacity="0.35"/>
  <rect x="28" y="137" width="72" height="4" rx="2" fill="#1A3530" opacity="0.18"/>
  <rect x="28" y="146" width="55" height="4" rx="2" fill="#1A3530" opacity="0.12"/>
  <rect x="28" y="155" width="72" height="4" rx="2" fill="#E27D60" opacity="0.35"/>
  <rect x="28" y="164" width="66" height="4" rx="2" fill="#1A3530" opacity="0.18"/>
  <rect x="28" y="173" width="72" height="4" rx="2" fill="#4A9B8E" opacity="0.28"/>
  <rect x="28" y="182" width="44" height="4" rx="2" fill="#1A3530" opacity="0.12"/>
  <rect x="28" y="191" width="72" height="4" rx="2" fill="#1A3530" opacity="0.14"/>
  <rect x="28" y="200" width="58" height="4" rx="2" fill="#1A3530" opacity="0.10"/>

  <!-- ── Flowing dots connector ──────────────────────── -->
  <circle cx="125" cy="120" r="4" fill="#4A9B8E" opacity="0.5"/>
  <circle cx="136" cy="120" r="4" fill="#4A9B8E" opacity="0.38"/>
  <circle cx="147" cy="120" r="4" fill="#4A9B8E" opacity="0.26"/>
  <circle cx="125" cy="155" r="4" fill="#E27D60" opacity="0.5"/>
  <circle cx="136" cy="155" r="4" fill="#E27D60" opacity="0.38"/>
  <circle cx="147" cy="155" r="4" fill="#E27D60" opacity="0.26"/>

  <!-- ── AI Brain / robot circle (center) ───────────── -->
  <circle cx="168" cy="140" r="44" fill="url(#brainGrad)" filter="url(#sh2)" opacity="0.95"/>
  <!-- Inner circuit lines -->
  <circle cx="168" cy="140" r="36" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
  <line x1="168" y1="104" x2="168" y2="176" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="132" y1="140" x2="204" y2="140" stroke="white" stroke-width="1" opacity="0.15"/>
  <!-- Brain nodes -->
  <circle cx="168" cy="118" r="5" fill="white" opacity="0.6"/>
  <circle cx="148" cy="135" r="5" fill="white" opacity="0.6"/>
  <circle cx="188" cy="135" r="5" fill="white" opacity="0.6"/>
  <circle cx="155" cy="158" r="5" fill="white" opacity="0.6"/>
  <circle cx="181" cy="158" r="5" fill="white" opacity="0.6"/>
  <!-- Node connectors -->
  <line x1="168" y1="118" x2="148" y2="135" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="168" y1="118" x2="188" y2="135" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="148" y1="135" x2="155" y2="158" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="188" y1="135" x2="181" y2="158" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="148" y1="135" x2="188" y2="135" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- AI label -->
  <text x="168" y="145" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">AI</text>

  <!-- ── Sparkle stars around brain ─────────────────── -->
  <path d="M138,96 L140,102 L146,102 L141,106 L143,112 L138,108 L133,112 L135,106 L130,102 L136,102 Z" fill="#FFD700" filter="url(#glow)"/>
  <path d="M196,100 L197.5,105 L203,105 L198.5,108 L200,113 L196,110 L192,113 L193.5,108 L189,105 L194.5,105 Z" fill="#FFD700" opacity="0.75"/>
  <circle cx="156" cy="94" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="180" cy="90" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="143" cy="174" r="3" fill="#FFDAD5" opacity="0.7"/>
  <circle cx="194" cy="177" r="2.5" fill="#B8E6DD" opacity="0.7"/>

  <!-- ── Output item chips (right) ──────────────────── -->
  <!-- Chip 1 - word chip -->
  <rect x="224" y="80"  width="80" height="28" rx="14" fill="url(#chipGrad1)" filter="url(#sh2)"/>
  <circle cx="241" cy="94" r="8" fill="white" opacity="0.25"/>
  <path d="M237,90 L237,98 M237,94 L245,94 M241,90 L241,98" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="271" y="99" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">apple</text>

  <!-- Chip 2 - expression chip -->
  <rect x="224" y="122" width="80" height="28" rx="14" fill="url(#chipGrad2)" filter="url(#sh2)"/>
  <circle cx="241" cy="136" r="8" fill="white" opacity="0.25"/>
  <path d="M237,132 Q241,128 245,132 Q241,136 237,132" fill="white" opacity="0.7"/>
  <text x="271" y="141" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">look into</text>

  <!-- Chip 3 - example chip -->
  <rect x="224" y="164" width="80" height="28" rx="14" fill="url(#chipGrad3)" filter="url(#sh2)"/>
  <circle cx="241" cy="178" r="8" fill="white" opacity="0.25"/>
  <path d="M237,175 L239,177 L245,171" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="271" y="183" font-family="Arial,sans-serif" font-size="9.5" font-weight="bold" fill="white" text-anchor="middle">example</text>

  <!-- Chat bubble at bottom right -->
  <rect x="232" y="208" width="72" height="36" rx="10" fill="white" stroke="#B8E6DD" stroke-width="1.5" filter="url(#sh2)"/>
  <path d="M258,244 L250,252 L260,244" fill="white" stroke="#B8E6DD" stroke-width="1.5"/>
  <rect x="241" y="217" width="52" height="4" rx="2" fill="#4A9B8E" opacity="0.35"/>
  <rect x="241" y="225" width="40" height="4" rx="2" fill="#4A9B8E" opacity="0.25"/>
  <rect x="241" y="233" width="48" height="4" rx="2" fill="#E27D60" opacity="0.35"/>

  <!-- Small connecting arrows from brain to chips -->
  <path d="M212,110 Q218,94 224,94"  stroke="#4A9B8E" stroke-width="1.5" fill="none" stroke-dasharray="4,3" opacity="0.6"/>
  <path d="M212,140 L224,136"        stroke="#E27D60" stroke-width="1.5" fill="none" stroke-dasharray="4,3" opacity="0.6"/>
  <path d="M212,165 Q218,170 224,178" stroke="#C5A0B5" stroke-width="1.5" fill="none" stroke-dasharray="4,3" opacity="0.6"/>
</svg>

