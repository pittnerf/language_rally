<svg width="320" height="280" viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAF9"/>
      <stop offset="100%" style="stop-color:#FFDAD5"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E27D60"/>
      <stop offset="100%" style="stop-color:#B85A3E"/>
    </linearGradient>
    <linearGradient id="micHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8906E"/>
      <stop offset="100%" style="stop-color:#C5583C"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9B8E"/>
      <stop offset="100%" style="stop-color:#2E7A6E"/>
    </linearGradient>
    <filter id="sh4" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E27D60" flood-opacity="0.22"/>
    </filter>
    <filter id="waveSh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4A9B8E" flood-opacity="0.18"/>
    </filter>
    <filter id="bubbleSh" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A3530" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="280" fill="url(#bg4)" rx="20"/>

  <!-- Soft circles -->
  <circle cx="286" cy="38" r="46" fill="#FFDAD5" opacity="0.4"/>
  <circle cx="30" cy="248" r="34" fill="#B8E6DD" opacity="0.38"/>
  <circle cx="294" cy="255" r="26" fill="#B8E6DD" opacity="0.3"/>

  <!-- ── Microphone ──────────────────────────────────── -->
  <!-- Mic glow halo -->
  <ellipse cx="160" cy="148" rx="48" ry="56" fill="#E27D60" opacity="0.07"/>

  <!-- Mic head (capsule) -->
  <rect x="136" y="76" width="48" height="76" rx="24" fill="url(#micHead)" filter="url(#sh4)"/>
  <!-- Mic grille lines -->
  <rect x="140" y="90" width="40" height="3" rx="1.5" fill="white" opacity="0.18"/>
  <rect x="140" y="98" width="40" height="3" rx="1.5" fill="white" opacity="0.18"/>
  <rect x="140" y="106" width="40" height="3" rx="1.5" fill="white" opacity="0.18"/>
  <rect x="140" y="114" width="40" height="3" rx="1.5" fill="white" opacity="0.18"/>
  <rect x="140" y="122" width="40" height="3" rx="1.5" fill="white" opacity="0.18"/>
  <rect x="140" y="130" width="40" height="3" rx="1.5" fill="white" opacity="0.18"/>
  <!-- Mic shine -->
  <ellipse cx="148" cy="92" rx="6" ry="9" fill="white" opacity="0.18"/>

  <!-- Mic body / stem -->
  <rect x="152" y="150" width="16" height="36" rx="6" fill="url(#micGrad)"/>

  <!-- Mic stand arm -->
  <path d="M130,176 Q130,198 160,198 Q190,198 190,176"
        fill="none" stroke="url(#baseGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Mic stand base -->
  <rect x="138" y="196" width="44" height="7" rx="3.5" fill="url(#baseGrad)" filter="url(#sh4)"/>
  <ellipse cx="160" cy="203" rx="28" ry="5" fill="#2E7A6E" opacity="0.15"/>

  <!-- ── Animated sound waves (concentric arcs) ─────── -->
  <!-- Left waves -->
  <path d="M122,108 Q106,122 106,140 Q106,158 122,172"
        stroke="#E27D60" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#waveSh)"/>
  <path d="M110,98 Q88,116 88,140 Q88,164 110,182"
        stroke="#E27D60" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45"/>
  <path d="M98,88 Q70,110 70,140 Q70,170 98,192"
        stroke="#E27D60" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.25"/>
  <path d="M86,78 Q52,104 52,140 Q52,176 86,202"
        stroke="#E27D60" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.14"/>

  <!-- Right waves -->
  <path d="M198,108 Q214,122 214,140 Q214,158 198,172"
        stroke="#4A9B8E" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#waveSh)"/>
  <path d="M210,98 Q232,116 232,140 Q232,164 210,182"
        stroke="#4A9B8E" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45"/>
  <path d="M222,88 Q250,110 250,140 Q250,170 222,192"
        stroke="#4A9B8E" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.25"/>
  <path d="M234,78 Q268,104 268,140 Q268,176 234,202"
        stroke="#4A9B8E" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.14"/>

  <!-- ── Phonetic / word bubbles ─────────────────────── -->
  <!-- Bubble 1 - top left -->
  <rect x="18" y="66" width="72" height="30" rx="15" fill="white" stroke="#E27D60" stroke-width="1.5" filter="url(#bubbleSh)"/>
  <text x="54" y="86" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#E27D60" text-anchor="middle">/æpl/</text>

  <!-- Bubble 2 - bottom left -->
  <rect x="18" y="190" width="72" height="30" rx="15" fill="white" stroke="#4A9B8E" stroke-width="1.5" filter="url(#bubbleSh)"/>
  <text x="54" y="210" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4A9B8E" text-anchor="middle">/θɪŋk/</text>

  <!-- Bubble 3 - top right -->
  <rect x="232" y="66" width="72" height="30" rx="15" fill="white" stroke="#C5A0B5" stroke-width="1.5" filter="url(#bubbleSh)"/>
  <text x="268" y="86" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#C5A0B5" text-anchor="middle">/wɔːtər/</text>

  <!-- Bubble 4 - bottom right -->
  <rect x="232" y="190" width="72" height="30" rx="15" fill="white" stroke="#E27D60" stroke-width="1.5" filter="url(#bubbleSh)"/>
  <text x="268" y="210" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#E27D60" text-anchor="middle">/biːt/</text>

  <!-- ── Waveform display strip at bottom ───────────── -->
  <rect x="46" y="226" width="228" height="38" rx="10" fill="white" opacity="0.7" filter="url(#bubbleSh)"/>
  <!-- Waveform bars -->
  <rect x="58"  y="233" width="5" height="10" rx="2.5" fill="#4A9B8E" opacity="0.5"/>
  <rect x="67"  y="230" width="5" height="16" rx="2.5" fill="#4A9B8E" opacity="0.65"/>
  <rect x="76"  y="235" width="5" height="7"  rx="2.5" fill="#4A9B8E" opacity="0.5"/>
  <rect x="85"  y="228" width="5" height="20" rx="2.5" fill="#E27D60" opacity="0.75"/>
  <rect x="94"  y="232" width="5" height="13" rx="2.5" fill="#E27D60" opacity="0.65"/>
  <rect x="103" y="236" width="5" height="8"  rx="2.5" fill="#4A9B8E" opacity="0.5"/>
  <rect x="112" y="229" width="5" height="22" rx="2.5" fill="#E27D60" opacity="0.8"/>
  <rect x="121" y="231" width="5" height="18" rx="2.5" fill="#E27D60" opacity="0.7"/>
  <rect x="130" y="234" width="5" height="11" rx="2.5" fill="#4A9B8E" opacity="0.55"/>
  <rect x="139" y="227" width="5" height="24" rx="2.5" fill="#E27D60" opacity="0.85"/>
  <rect x="148" y="230" width="5" height="19" rx="2.5" fill="#C5A0B5" opacity="0.75"/>
  <rect x="157" y="234" width="5" height="11" rx="2.5" fill="#4A9B8E" opacity="0.5"/>
  <rect x="166" y="228" width="5" height="22" rx="2.5" fill="#E27D60" opacity="0.8"/>
  <rect x="175" y="232" width="5" height="14" rx="2.5" fill="#4A9B8E" opacity="0.6"/>
  <rect x="184" y="235" width="5" height="9"  rx="2.5" fill="#C5A0B5" opacity="0.5"/>
  <rect x="193" y="229" width="5" height="20" rx="2.5" fill="#E27D60" opacity="0.75"/>
  <rect x="202" y="233" width="5" height="12" rx="2.5" fill="#4A9B8E" opacity="0.55"/>
  <rect x="211" y="236" width="5" height="7"  rx="2.5" fill="#4A9B8E" opacity="0.45"/>
  <rect x="220" y="231" width="5" height="17" rx="2.5" fill="#E27D60" opacity="0.7"/>
  <rect x="229" y="234" width="5" height="10" rx="2.5" fill="#4A9B8E" opacity="0.5"/>
  <rect x="238" y="232" width="5" height="13" rx="2.5" fill="#C5A0B5" opacity="0.6"/>
  <rect x="247" y="236" width="5" height="8"  rx="2.5" fill="#4A9B8E" opacity="0.45"/>
  <rect x="256" y="230" width="5" height="18" rx="2.5" fill="#E27D60" opacity="0.72"/>

  <!-- Playhead indicator -->
  <line x1="148" y1="227" x2="148" y2="263" stroke="#E27D60" stroke-width="1.5" opacity="0.6"/>
  <circle cx="148" cy="226" r="3" fill="#E27D60" opacity="0.7"/>

  <!-- Stars / sparkles -->
  <path d="M284,110 L286,117 L293,117 L287.5,121 L289.5,128 L284,124 L278.5,128 L280.5,121 L275,117 L282,117 Z" fill="#FFD700" opacity="0.85"/>
  <path d="M36,128 L37.5,133 L43,133 L38.5,136 L40,141 L36,138 L32,141 L33.5,136 L29,133 L34.5,133 Z" fill="#FFD700" opacity="0.65"/>
  <circle cx="52" cy="75" r="3" fill="#FFD700" opacity="0.5"/>
  <circle cx="272" cy="176" r="2.5" fill="#FFDAD5" opacity="0.7"/>
</svg>

