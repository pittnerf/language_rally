<svg width="320" height="280" viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAF9"/>
      <stop offset="100%" style="stop-color:#B8E6DD"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7A6E"/>
      <stop offset="100%" style="stop-color:#1A4A44"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E27D60"/>
      <stop offset="100%" style="stop-color:#C5583C"/>
    </linearGradient>
    <linearGradient id="bronzeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CD7F32"/>
      <stop offset="100%" style="stop-color:#E8963D"/>
    </linearGradient>
    <linearGradient id="silverBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9E9E9E"/>
      <stop offset="100%" style="stop-color:#BDBDBD"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFA000"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="tealBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9B8E"/>
      <stop offset="100%" style="stop-color:#5DB8A8"/>
    </linearGradient>
    <filter id="sh3" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2E7A6E" flood-opacity="0.18"/>
    </filter>
    <filter id="carShadow" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A4A44" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="280" fill="url(#bg3)" rx="20"/>

  <!-- Soft accent circles -->
  <circle cx="295" cy="35" r="44" fill="#B8E6DD" opacity="0.32"/>
  <circle cx="22" cy="248" r="32" fill="#FFDAD5" opacity="0.42"/>
  <circle cx="300" cy="255" r="22" fill="#F0E0EB" opacity="0.45"/>

  <!-- ── Curved track ──────────────────────────────── -->
  <!-- Outer track band -->
  <path d="M24,190 Q30,120 100,95 Q175,70 240,105 Q300,135 296,190"
        stroke="#7BC4B8" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.25"/>
  <!-- Track surface -->
  <path d="M24,190 Q30,120 100,95 Q175,70 240,105 Q300,135 296,190"
        stroke="url(#trackGrad)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Center dashed line -->
  <path d="M24,190 Q30,120 100,95 Q175,70 240,105 Q300,135 296,190"
        stroke="white" stroke-width="2" fill="none" stroke-dasharray="14,10" opacity="0.35"/>
  <!-- Track edge highlights -->
  <path d="M24,190 Q30,120 100,95 Q175,70 240,105 Q300,135 296,190"
        stroke="white" stroke-width="1" fill="none" stroke-dasharray="none" opacity="0.15"
        stroke-dashoffset="11"/>

  <!-- Start/finish flag-post -->
  <rect x="26" y="148" width="4" height="46" rx="2" fill="#1A3530"/>
  <rect x="30" y="148" width="22" height="14" fill="#4A9B8E"/>
  <rect x="30" y="152" width="5" height="5" fill="white" opacity="0.8"/>
  <rect x="35" y="148" width="5" height="5" fill="white" opacity="0.8"/>
  <rect x="40" y="152" width="5" height="5" fill="white" opacity="0.8"/>
  <rect x="45" y="148" width="7" height="5" fill="white" opacity="0.8"/>

  <!-- ── Rally car (on track) ──────────────────────── -->
  <!-- Wheel shadows -->
  <ellipse cx="155" cy="153" rx="12" ry="4" fill="#1A3530" opacity="0.2"/>
  <ellipse cx="195" cy="143" rx="12" ry="4" fill="#1A3530" opacity="0.2"/>

  <!-- Car body -->
  <path d="M138,142 Q148,128 162,125 L198,118 Q210,117 218,126 L222,140 Q210,148 190,150 L148,155 Q140,153 138,142 Z"
        fill="url(#carBody)" filter="url(#carShadow)"/>
  <!-- Car cockpit / windshield -->
  <path d="M162,125 Q168,116 182,114 Q194,113 198,118 L198,126 Q188,130 168,133 Z"
        fill="#B8E6DD" opacity="0.7"/>
  <!-- Car stripe -->
  <path d="M145,147 Q165,143 195,137 L200,140 Q180,145 148,151 Z"
        fill="white" opacity="0.18"/>
  <!-- Number on car -->
  <text x="175" y="144" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">01</text>
  <!-- Front wheel -->
  <circle cx="216" cy="140" r="9" fill="#1A3530"/>
  <circle cx="216" cy="140" r="5" fill="#555"/>
  <circle cx="216" cy="140" r="2" fill="#999"/>
  <!-- Rear wheel -->
  <circle cx="152" cy="152" r="10" fill="#1A3530"/>
  <circle cx="152" cy="152" r="6" fill="#555"/>
  <circle cx="152" cy="152" r="2.5" fill="#999"/>

  <!-- Speed streaks -->
  <line x1="100" y1="132" x2="122" y2="130" stroke="#E27D60" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="95" y1="140" x2="118" y2="140" stroke="#E27D60" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="98" y1="148" x2="120" y2="147" stroke="#E27D60" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>

  <!-- ── Progress / XP bars panel (top-right) ─────── -->
  <rect x="194" y="26" width="112" height="84" rx="10" fill="white" opacity="0.82" filter="url(#sh3)"/>
  <!-- Label -->
  <text x="250" y="44" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#4A9B8E" text-anchor="middle" letter-spacing="1">PROGRESS</text>

  <!-- Bar 1 - Vocabulary -->
  <text x="204" y="59" font-family="Arial,sans-serif" font-size="8" fill="#1A3530" opacity="0.6">Vocab</text>
  <rect x="204" y="62" width="92" height="7" rx="3.5" fill="#B8E6DD"/>
  <rect x="204" y="62" width="75" height="7" rx="3.5" fill="url(#tealBar)"/>

  <!-- Bar 2 - Grammar -->
  <text x="204" y="79" font-family="Arial,sans-serif" font-size="8" fill="#1A3530" opacity="0.6">Grammar</text>
  <rect x="204" y="82" width="92" height="7" rx="3.5" fill="#FFDAD5"/>
  <rect x="204" y="82" width="58" height="7" rx="3.5" fill="url(#bronzeBar)" opacity="0.8"/>

  <!-- Bar 3 - Speaking -->
  <text x="204" y="99" font-family="Arial,sans-serif" font-size="8" fill="#1A3530" opacity="0.6">Speaking</text>
  <rect x="204" y="102" width="92" height="7" rx="3.5" fill="#F0E0EB"/>
  <rect x="204" y="102" width="46" height="7" rx="3.5" fill="url(#silverBar)"/>

  <!-- ── Podium (bottom left) ─────────────────────── -->
  <!-- 2nd place -->
  <rect x="28" y="217" width="42" height="38" rx="4" fill="url(#silverBar)" opacity="0.85"/>
  <text x="49" y="241" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">2</text>
  <!-- 1st place -->
  <rect x="74" y="200" width="46" height="55" rx="4" fill="url(#goldBar)" opacity="0.9"/>
  <text x="97" y="234" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <!-- 3rd place -->
  <rect x="124" y="228" width="40" height="27" rx="4" fill="url(#bronzeBar)" opacity="0.85"/>
  <text x="144" y="248" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">3</text>

  <!-- Trophy on 1st -->
  <path d="M89,190 L89,183 L105,183 L105,190 Q105,202 97,205 Q89,202 89,190" fill="#FFD700" stroke="#FFA000" stroke-width="1.5"/>
  <line x1="97" y1="205" x2="97" y2="210" stroke="#FFA000" stroke-width="2"/>
  <rect x="91" y="210" width="12" height="4" rx="2" fill="#FFA000"/>

  <!-- Stars above podium -->
  <path d="M62,204 L64,211 L71,211 L65,215 L67,222 L62,218 L57,222 L59,215 L53,211 L60,211 Z" fill="#FFD700"/>
  <path d="M150,198 L151.5,203 L157,203 L152.5,206 L154,211 L150,208 L146,211 L147.5,206 L143,203 L148.5,203 Z" fill="#FFD700" opacity="0.7"/>
  <circle cx="34"  cy="210" r="3" fill="#FFD700" opacity="0.5"/>
  <circle cx="170" cy="218" r="2" fill="#FFD700" opacity="0.5"/>

  <!-- Brain icon top-left corner -->
  <circle cx="48" cy="52" r="22" fill="white" opacity="0.6" filter="url(#sh3)"/>
  <!-- Simple brain shape -->
  <path d="M38,52 Q38,42 48,40 Q58,38 60,46 Q65,44 66,52 Q66,60 60,62 Q58,66 52,65 Q46,66 44,62 Q38,62 38,52 Z"
        fill="#4A9B8E" opacity="0.7"/>
  <!-- Brain divider -->
  <path d="M48,40 Q49,52 48,65" stroke="white" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- Lightning bolt on brain -->
  <path d="M50,44 L46,52 L50,52 L46,62 L54,50 L50,50 Z" fill="#FFD700"/>
</svg>

